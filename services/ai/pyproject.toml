[project]
name = "joblog-ai"
version = "0.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
files = ["app", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Read the time through Clock (app/clock.py)."
"datetime.datetime.utcnow".msg = "Read the time through Clock (app/clock.py)."

[tool.ruff.lint.per-file-ignores]
"app/clock.py" = ["TID251"]
